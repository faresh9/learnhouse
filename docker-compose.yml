version: "3.9"
services:
  app:
    build: .
    ports:
      - "80:80"   # Expose port 80 for the frontend (adjust as needed)
      - "1338:1338"  # Backend API exposed port (if needed externally)
      - "1998:1998"  # WebSocket exposed port (if needed externally)
    volumes:
      - .:/usr/learnhouse
    env_file:
      - ./extra/example-learnhouse-conf.env  # Ensure this file includes the updated env vars for production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"   # Expose the database port (adjust as needed)
    environment:
      - POSTGRES_USER=learnhouse
      - POSTGRES_PASSWORD=learnhouse
      - POSTGRES_DB=learnhouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7.2.3
    restart: always
    ports:
      - "6379:6379"   # Expose the Redis port (adjust as needed)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.16
    ports:
      - "8000:8000"   # Expose the Chroma DB port (adjust as needed)
